<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">

<title>제출 전 영상 점검 (시안)</title>
<!--
  홍보대사 제출 전 영상 점검 (2026-11-21). 브라우저 안에서만 돈다(영상은 어디에도 올라가지 않음, 토큰 없음).
  기준: _도구/scripts/팀콘검수/prompt.md(파일 이름·규격·가림), context/draw_actual.ps1(실제 가림 영역 좌표), README(자막 자리),
        02_카드뉴스·스토리/context/organization.md(학과 이름), 지난 팀콘 검수 result.json의 자주 나온 수정(자막 글 규칙).
  가림 좌표·자막 자리·조직도가 바뀌면 아래 Z·BAND·DEPTS도 같이 고친다.
-->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root {
  --paper: #e9ebee; --panel: #ffffff; --ink: #16181b; --soft: #5d636b; --line: #d3d7dc; --chip: #f1f3f5;
  --ui: "Pretendard Variable", "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --display: "Cafe24Ssurround", "Pretendard Variable", "Malgun Gothic", sans-serif;
}
/* 홍비디오 커버 만들기와 같은 틀: 써라운드 제목, 블랙앤화이트, 홍비디오 로고가 도는 불러오기 화면 */
@font-face { font-family: "Cafe24Ssurround"; src: url("../fonts/Cafe24Ssurround.ttf") format("truetype"); font-display: swap; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #121417; --panel: #1b1e22; --ink: #eceef0; --soft: #9aa1a9; --line: #30353b; --chip: #24282d; color-scheme: dark } }
:root[data-theme="dark"] { --paper: #121417; --panel: #1b1e22; --ink: #eceef0; --soft: #9aa1a9; --line: #30353b; --chip: #24282d; color-scheme: dark }
[hidden] { display: none !important; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--ui); font-size: 14px; line-height: 1.55; letter-spacing: -0.01em; word-break: keep-all; overflow-wrap: break-word; }   /* anywhere는 가운데 정렬 칸에서 낱자로 끊김(2026-11-23 휴대폰) */
.wrap { max-width: 760px; margin: 0 auto; padding: 24px 16px 60px; display: flex; flex-direction: column; gap: 16px; }
h1 { font-family: var(--display); font-weight: 400; font-size: 30px; line-height: 1.1; margin: 4px 0 0; letter-spacing: -0.02em; }
.drop .big { font-size: 15px; font-weight: 700; margin: 0; }
/* 불러오는 중: 화면 전체를 덮는 막 + 도는 로고 */
.loading { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
  background: rgba(10,12,14,.93); color: #fff; text-align: center; padding: max(20px, env(safe-area-inset-top, 0px)) 20px max(20px, env(safe-area-inset-bottom, 0px)); font-size: 15px; }
.loading .logo-spin { width: 76px; height: 76px; animation: spin 1.6s linear infinite; filter: drop-shadow(0 2px 8px rgba(0,0,0,.4)); }
.loading .sub { color: #c9ced4; font-size: 12.5px; max-width: min(320px, 80vw); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
.loading .sub:empty { display: none; }
.loading .bar { flex: none; width: min(220px, 70%); height: 4px; border-radius: 2px; background: rgba(255,255,255,.2); overflow: hidden; }
.loading .bar i { background: #fff; }
.loading .skip { margin-top: 4px; background: transparent; color: #fff; border-color: rgba(255,255,255,.45); font-size: 13px; padding: 6px 12px; }
.loading .skip:hover { border-color: #fff; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .logo-spin { animation-duration: 4s; } }
.intro { color: var(--soft); margin: 4px 0 0; }
.step { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.step h2 { font-size: 15px; margin: 0; display: flex; align-items: center; gap: 8px; }
.step h2 .n { width: 22px; height: 22px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 12px; background: var(--ink); color: var(--panel); flex: none; }
.hint { color: var(--soft); font-size: 12.5px; margin: 0; }
button, .file { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 7px; padding: 8px 14px; cursor: pointer; touch-action: manipulation; }
button:hover, .file:hover { border-color: var(--ink); }
button:focus-visible, .file:focus-within, textarea:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.file { position: relative; display: inline-block; font-weight: 700; background: var(--ink); color: var(--panel); border-color: var(--ink); }
.file input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.drop { border: 2px dashed var(--line); border-radius: 10px; padding: 22px 16px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
.drop.on { border-color: var(--ink); }
/* 영상을 넣은 뒤엔 넣기 칸을 접고 파일 이름 한 줄 + 「다른 영상」만 남긴다(2026-11-22) */
.cur { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-width: 0; }
.cur .hint { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13px; color: var(--ink); }
.cur .file { flex: none; background: var(--panel); color: var(--ink); border-color: var(--line); font-weight: 400; padding: 6px 12px; font-size: 13px; }
.step.on { outline: 2px solid var(--ink); outline-offset: -2px; }
.prog { display: flex; align-items: center; gap: 10px; color: var(--soft); font-size: 13px; }
.bar { flex: 1; height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--ink); transition: width .2s; }
/* 결과 목록: 꼭(✕)·확인(!)·좋음(✓) — 색 대신 기호와 굵기 */
.res { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.res li { display: grid; grid-template-columns: 26px 1fr; gap: 6px; align-items: start; }
.res .ic { width: 22px; height: 22px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 12px; font-weight: 800; }
.res .bad .ic { background: var(--ink); color: var(--panel); }
.res .chk .ic { border: 2px solid var(--ink); }
.res .ok .ic { color: var(--soft); border: 1px solid var(--line); }
.res b { display: block; }
.res .bad b { font-weight: 800; }
.res .ok b { font-weight: 500; color: var(--soft); }
.res span { display: block; color: var(--soft); font-size: 13px; }
.res li > div { min-width: 0; }
.res .shots { display: flex; gap: 6px; margin-top: 6px; overflow-x: auto; padding-bottom: 2px; }
.res .shots img { height: 150px; border-radius: 4px; display: block; cursor: zoom-in; flex: none; background: #000; }
.res .shots img.sub { height: auto; width: min(100%, 320px); }
/* 위치 문제는 캡처가 설명이라 크게(2026-11-23 담당자 「어긋나는 가이드 이미지만 보여줘도 충분」) */
.res .shots img.big { height: min(320px, 70vw); }
.res .shots img.sub.big, .res .shots img.big.wide { height: auto; width: min(100%, 520px); }   /* 롱폼 캡처는 휴대폰 폭에 맞춰 잘리지 않게 */
.res .when { font-variant-numeric: tabular-nums; margin-right: 6px; }
.sum { font-size: 15px; font-weight: 700; margin: 0; }
/* 장면 시트 */
dialog { border: 0; padding: 0; background: transparent; max-width: 96vw; }
dialog::backdrop { background: rgba(0,0,0,.8); }
dialog canvas { max-height: 88vh; max-width: 96vw; display: block; border-radius: 6px; }
dialog p { color: #fff; text-align: center; margin: 8px 0 0; font-size: 13px; }
/* 자막 글 */
textarea { font: inherit; font-size: 14px; width: 100%; box-sizing: border-box; min-height: 120px; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--ink); resize: vertical; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.fix { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.fix li { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
.fix li.bad { border: 2px solid var(--ink); padding: 7px 9px; }
.fix .t { font-variant-numeric: tabular-nums; color: var(--soft); font-size: 12px; }
.fix .ch { font-size: 14px; }
.fix .ch s { color: var(--soft); }
.fix .ch strong { font-weight: 800; }
.fix .why { color: var(--soft); font-size: 12.5px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>제출 전 영상 점검</h1>
    <p class="intro">영상만 넣으면 검수에서 걸릴 것 미리 잡아 줘요!</p>
  </header>

  <section class="step">
    <h2><span class="n">1</span>영상 넣기</h2>
    <div class="drop" id="drop">
      <p class="big">검수 통과각인지 볼까요?</p>
      <label class="file">영상 열기<input type="file" id="vfile"></label>
      <p class="hint">여기로 끌어다 놓아도 돼요<br>자막까지 넣고 내보낸 최종본이요</p>
      <p class="hint">영상은 이 화면 밖으로 안 나가요</p>
    </div>
    <div class="cur" id="cur" hidden><p class="hint" id="curName"></p><label class="file">다른 영상 넣기<input type="file" id="vfile2"></label></div>
  </section>

  <section class="step" id="resStep" hidden>
    <h2><span class="n">2</span>점검 결과</h2>
    <p class="sum" id="sum"></p>
    <ul class="res" id="res"></ul>
  </section>

  <section class="step" id="subStep" hidden>
    <h2><span class="n">3</span>자막 글 점검</h2>
    <p class="hint" id="subHint">영상을 넣으면 자막 글자를 읽어 여기에 채우고, 띄어쓰기·맞춤법에서 자주 틀리는 것을 찾아요</p>
    <textarea id="subs" placeholder="영상을 넣으면 자막 글이 여기에 채워져요 · 직접 붙여 넣어도 돼요"></textarea>
    <div class="row">
      <button type="button" id="subCheck">고친 글로 다시 점검</button>
      <label class="file" style="background:var(--panel);color:var(--ink);border-color:var(--line);font-weight:400">.srt·.txt 넣기<input type="file" id="sfile" accept=".srt,.txt,text/plain"></label>
    </div>
    <p class="sum" id="subSum" hidden></p>
    <ul class="fix" id="fix"></ul>
    <p class="hint" id="subNote" hidden>규칙으로 찾는 거라 모든 틀린 곳을 잡지는 못해요. 말투를 살린 예능 자막(ㅋㅋ, 늘인 말)은 그대로 둬도 돼요.</p>
  </section>
</div>

<div class="loading" id="loading" hidden role="status" aria-live="polite"><img class="logo-spin" src="../logos/hong.png" alt=""><div id="loadMsg">영상 불러오고 있어요</div><div class="sub" id="loadStep"></div><div class="sub" id="loadTime"></div><div class="sub" id="loadSub"></div><div class="bar"><i id="loadBarIn"></i></div><button type="button" class="skip" id="loadSkip" hidden>그만 읽고 결과 볼게요</button></div>

<dialog id="big"><canvas id="bigC"></canvas><p id="bigT"></p></dialog>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };

  // ── 기준값
  // 실제 가림 영역(영상 비율, 2026-11-01 아이폰 캡처로 잼): 빨간 선 = 보이는 곳, 밖 = 가려짐
  var Z = {
    top: [0, 0, 1, 0.125, "위 상태 표시줄"],
    right: [0.855, 0.385, 1, 0.944, "오른쪽 좋아요·공유 버튼"],
    bottom: [0, 0.79, 0.733, 0.958, "아래 계정 이름·캡션"],
    left: [0, 0, 0.044, 1, "왼쪽 끝(잘림)"],
    rightEdge: [0.962, 0, 1, 0.385, "오른쪽 끝(잘림)"],
    subR: [0.855, 0.667, 0.97, 0.77, "오른쪽 좋아요·공유 버튼(자막 끝)"]   // 자막 줄 높이(BAND.v ± 0.01)만
  };
  var RED = [[0.05, 0.125], [0.955, 0.125], [0.955, 0.385], [0.855, 0.385], [0.855, 0.79], [0.05, 0.79]];
  var YEL = [0.06, 0.14, 0.94, 0.65];
  // 롱폼: 빨간 점선 = 타이틀 세이프(가장자리 5%), 하늘색 = 자막 칸(SemiBold 50px 한 줄), 하늘색 점선 = 추가 자막 칸(Medium 40px)
  var LONG = { safe: [0.05, 0.05, 0.95, 0.95], sub: [0.1, 917 / 1080, 0.9, 977 / 1080], extra: [0.1, 856 / 1080, 0.9, 904 / 1080] };
  var BAND = { v: [0.157, 0.677, 0.843, 0.76], h: [0.1, 0.8, 0.9, 0.92] };   // 자막 자리(숏폼 1300~1460, 롱폼 아래쪽)
  var DEPTS = "신학과경배찬양학과 영어영문학과 일본언어문화학과 중국어중국학과 역사콘텐츠학과 웹툰만화콘텐츠학과 한국어문학창작학부 경찰학과 문헌정보학과 법학과 사회복지학과 상담심리학과 행정학과 경영학과 금융보험학과 물류무역학과 부동산국토정보학과 회계세무학과 IT금융학과 간호학과 물리치료학과 방사선학과 보건관리학과 작업치료학과 식품영양학과 재활학과 환경생명과학과 운동처방학과 건축공학과 건축학과 기계공학과 기계자동차공학과 산업공학과 소방안전공학과 첨단신소재공학과 전기전자공학과 정보통신공학과 토목환경공학과 기초과학과 탄소융합공학과 데이터공학과 스마트미디어학과 인공지능학과 컴퓨터공학과 게임콘텐츠학과 공연방송연기학과 공연예술학과 산업디자인학과 체육학과 시각디자인학과 영화방송학과 예술심리치료학과 음악학과 축구학과 태권도학과 관광경영학과 외식산업조리학과 패션산업학과 한식조리학과 호텔경영학과 국어교육과 영어교육과 중등특수교육과 한문교육과 가정교육과 과학교육과 수학교육과 교육학과 농식품경영학과 AI융합비즈니스학과 미네르바학부 반려동식물학과 친환경자동차학과 로컬벤처학부 교양학부 융합학부 자유전공학부 반려동물산업학부 동물보건학과 펫산업학과 국제학부".split(" ");


  // ── 결과 쌓기
  var items = [];
  function add(level, title, detail, imgs) { items.push({ level: level, title: title, detail: detail || "", imgs: imgs || null }); }
  function render() {
    var ul = $("res"); ul.innerHTML = "";
    var order = { bad: 0, chk: 1, ok: 2 }, n = { bad: 0, chk: 0, ok: 0 };
    items.slice().sort(function (a, b) { return order[a.level] - order[b.level]; }).forEach(function (it) {
      n[it.level]++;
      var li = document.createElement("li"); li.className = it.level;
      var ic = document.createElement("span"); ic.className = "ic"; ic.textContent = it.level === "bad" ? "✕" : it.level === "chk" ? "!" : "✓";
      var tx = document.createElement("div"), b = document.createElement("b"); b.textContent = it.title; tx.appendChild(b);
      if (it.detail) { var s = document.createElement("span"); s.textContent = it.detail; tx.appendChild(s); }
      if (it.imgs && it.imgs.length) {
        var sh = document.createElement("div"); sh.className = "shots";
        it.imgs.forEach(function (g) {
          var im = document.createElement("img"); im.src = g.src; im.alt = fmt(g.t) + " 장면"; im.className = (g.sub ? "sub " : "") + (g.big ? "big" : "") + (g.big && lastVert === false ? " wide" : "");
          im.onclick = function () { bigShow(g.t, lastVert, g.flags || [], g.boxes); };
          sh.appendChild(im);
        });
        tx.appendChild(sh);
      }
      li.appendChild(ic); li.appendChild(tx); ul.appendChild(li);
    });
    $("sum").textContent = n.bad ? "꼭 고칠 것 " + n.bad + "개" + (n.chk ? " · 확인할 것 " + n.chk + "개" : "")
      : n.chk ? "✓ 꼭 고칠 건 없어요 · 확인할 것 " + n.chk + "개만 봐 주세요" : "✓ 이대로 내도 돼요";
    $("resStep").hidden = false;
  }

  // ── 학과 이름: 조직도와 한 글자씩 대조
  function deptCheck(text, where) {
    var re = /([가-힣A-Za-z]{2,}?)(학과|학부|교육과)/g, m, seen = {};
    while ((m = re.exec(text))) {
      var w = m[0]; if (seen[w]) continue; seen[w] = 1;
      if (DEPTS.indexOf(w) >= 0 || DEPTS.some(function (d) { return w.length > d.length && w.slice(-d.length) === d; })) continue;
      var key = w.split("").sort().join(""), sim = DEPTS.filter(function (d) { return d.split("").sort().join("") === key; })[0] || nearest(w);
      add("chk", where + "의 「" + w + "」는 조직도에 없는 이름이에요", sim ? "조직도 표기: 「" + sim + "」" : "학과 이름을 한 번 더 확인해 주세요");
    }
  }
  function lev(a, b) {
    var d = []; for (var i = 0; i <= a.length; i++) { d[i] = [i]; } for (var j = 1; j <= b.length; j++) d[0][j] = j;
    for (i = 1; i <= a.length; i++) for (j = 1; j <= b.length; j++) d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    return d[a.length][b.length];
  }
  function nearest(w) { var best = null, bd = 3; DEPTS.forEach(function (d) { var x = lev(w, d); if (x < bd) { bd = x; best = d; } }); return best; }

  // ── 영상 열기
  var video = document.createElement("video");
  video.muted = true; video.playsInline = true; video.preload = "auto";
  video.setAttribute("playsinline", ""); video.setAttribute("muted", "");
  video.style.cssText = "position:fixed;left:0;top:0;width:2px;height:2px;opacity:0;pointer-events:none;";
  document.body.appendChild(video);

    { re: /프로포즈/g, to: function () { return "프러포즈"; }, why: "외래어 표기(프러포즈)", lv: "bad" },
    { re: /카카오 맵/g, to: function () { return "카카오맵"; }, why: "서비스 이름은 「카카오맵」이에요", lv: "bad" },
    { re: /빼빼로 데이/g, to: function () { return "빼빼로데이"; }, why: "기념일 이름은 붙여 쓰는 게 좋아요(사전에 없는 말이라 확인)", lv: "chk" },
    { re: /풀버전/g, to: function () { return "풀 버전"; }, why: "「풀 버전」은 띄어 써요", lv: "chk" },
    { re: /어떻해/g, to: function () { return "어떡해"; }, why: "「어떡해(어떻게 해)」가 맞아요", lv: "bad" },
    { re: /웬지/g, to: function () { return "왠지"; }, why: "「왠지(왜인지)」가 맞아요", lv: "bad" },
    { re: /왠일/g, to: function () { return "웬일"; }, why: "「웬일」이 맞아요", lv: "bad" },
    { re: /일부로/g, to: function () { return "일부러"; }, why: "「일부러」가 맞아요", lv: "bad" },
    { re: /설겆이/g, to: function () { return "설거지"; }, why: "「설거지」가 맞아요", lv: "bad" },
    { re: /(깨끗|곰곰|일일|틈틈|번번|겹겹|샅샅|따뜻|느긋|버젓)히/g, to: function (m) { return m[1] + ({ "깨끗": "이", "곰곰": "이", "일일": "이", "틈틈": "이", "번번": "이", "겹겹": "이", "샅샅": "이", "따뜻": "이", "느긋": "이", "버젓": "이" })[m[1]]; }, why: "「-이」로 써요(깨끗이, 곰곰이)", lv: "bad" },
    { re: /(꼼꼼|솔직|조용|확실|정확|급)이(?=[\s.,!?~]|$)/g, to: function (m) { return m[1] + "히"; }, why: "「-히」로 써요(꼼꼼히, 솔직히)", lv: "bad" },
    { re: /구지(?=[\s.,!?~]|$)/g, to: function () { return "굳이"; }, why: "「굳이」가 맞아요", lv: "bad" },
    { re: /설레임/g, to: function () { return "설렘"; }, why: "「설렘」이 맞아요", lv: "bad" },
    { re: /([내니제]|너)꺼(?=[야예에요지면니라든고나를의도,.!?~\s]|$)/g, to: function (m) { return m[1] + " 거"; }, why: "「거(것)」로 쓰고 띄어 써요(내 거)", lv: "bad" },
    { re: /뵈요/g, to: function () { return "봬요"; }, why: "「뵈어요」의 준말은 「봬요」예요", lv: "bad" },
    { re: /(^|[^안])되(서|도(?!록)|야|줘|버|봐|가지고)/g, to: function (m) { return m[1] + "돼" + m[2]; }, why: "「되어」의 준말은 「돼」예요(돼서, 돼도)", lv: "bad" },
    { re: /(^|[\s])않(하|해|했|한|할|돼|되|될|된)/g, to: function (m) { return m[1] + "안 " + m[2]; }, why: "부정은 「안 하다」예요(「않다」는 「-지 않다」에만)", lv: "bad" },
    { re: /(^|\s)할려(고|면|구)/g, to: function (m) { return m[1] + "하려" + m[2]; }, why: "「하려고」가 맞아요", lv: "bad" },
    { re: /가르켜|가르킨|가르키/g, to: function (m) { return m[0].replace("켜", "쳐").replace("킨", "친").replace("키", "치"); }, why: "「가르치다」(지식) 또는 「가리키다」(방향)예요", lv: "chk" },
    { re: /바램/g, to: function () { return "바람"; }, why: "「바라다」의 명사는 「바람」이에요", lv: "chk" },
    { re: /(^|\s)다음(사람|학생|분|질문|순서|게임|영상|장소|편|타자)/g, to: function (m) { return m[1] + "다음 " + m[2]; }, why: "「다음」은 뒷말과 띄어 써요(다음 사람)", lv: "bad" },
    { re: /(여기|거기|저기|어디)(있|없)/g, to: function (m) { return m[1] + " " + m[2]; }, why: "「있다·없다」는 띄어 써요(여기 있구나)", lv: "bad" },
    { re: /함께 (하|해|했|할|한)(?=[가-힣\s.,!?~]|$)/g, to: function (m) { return "함께" + m[1]; }, why: "「함께하다」는 한 단어예요(함께하고 싶은)", lv: "chk" },
    { re: /공강(시간|때)/g, to: function (m) { return "공강 " + m[1]; }, why: "「공강 시간·공강 때」는 띄어 써요", lv: "bad" },
    { re: / {2,}/g, to: function () { return " "; }, why: "두 칸 띄어쓰기예요 · 나열이면 쉼표를 써요", lv: "chk" }
  ];
  var ocrLow = {};   // 영상에서 읽은 줄마다 확실히 못 읽은 낱말(그 낱말에서 찾은 건 확인으로만)
  var ocrWeak = {};  // 흐리게 읽은 줄(그 줄에서 찾은 건 확인으로만)
  var BLUR = " · 흐리게 읽힌 글자라 캡처로 확인해 주세요";
  function parseSubs(txt) {   // SRT면 시간과 글, 아니면 줄 그대로
    var lines = txt.replace(/\r/g, "").split("\n"), out = [], t = "";
    for (var i = 0; i < lines.length; i++) {
      var s = lines[i];
      var tm = s.match(/^(\d{1,2}):(\d{2}):(\d{2})[,.]\d+\s*-->/);
      if (tm) { t = (+tm[1] * 60 + +tm[2]) + ":" + tm[3]; continue; }
      var tl = s.match(/^(\d{1,2}:\d{2})\s+(.+)$/);
      if (tl) { out.push({ t: tl[1], s: tl[2] }); continue; }
      if (/^\d+$/.test(s.trim()) || !s.trim()) continue;
      out.push({ t: t, s: s.replace(/<[^>]+>/g, "") });
    }
    return out;
  }
  function subCheck() {
    var list = parseSubs($("subs").value), found = [], seen = {};
    list.forEach(function (ln) {
      var f0 = found.length;
      RULES.forEach(function (r) {
        r.re.lastIndex = 0; var m;
        while ((m = r.re.exec(ln.s))) {
          if (r.when && !r.when(m, ln.s)) { if (m[0].length === 0) r.re.lastIndex++; continue; }
          var before = ln.s.slice(Math.max(0, m.index - 6), m.index), after = ln.s.slice(m.index + m[0].length, m.index + m[0].length + 6);
          var key = ln.t + "|" + m.index + "|" + m[0];
          if (seen[key]) continue; seen[key] = 1;
          var to = r.to(m), SEP = /[\s:;|'"\/,]/, ws = m.index, we = m.index + m[0].length;
          var lowW = ocrLow[ln.s];
          while (ws > 0 && !SEP.test(ln.s.charAt(ws - 1))) ws--;
          while (we < ln.s.length && !SEP.test(ln.s.charAt(we))) we++;
          if (r.re.source.charAt(0) === " ") ws = m.index;
          var wkey = ln.s.slice(ws, we).replace(/[^가-힣A-Za-z0-9]/g, "");
          var spaceless = ocrWeak[ln.s] && ln.s.indexOf(" ") < 0 && (ln.s.match(/[가-힣]/g) || []).length >= 7;
          if (spaceless && to.replace(/ /g, "") === m[0].replace(/ /g, "")) { if (m[0].length === 0) r.re.lastIndex++; continue; }   // 흐린 줄이 띄어쓰기를 통째로 잃었으면 띄어쓰기 지적은 안 함
          var blur = ocrWeak[ln.s] || (lowW && lowW.some(function (w) { return w && (wkey.indexOf(w) >= 0 || w.indexOf(wkey) >= 0 || lev(w, wkey) <= 2); }));
          found.push({ t: ln.t, from: m[0], to: to, pre: before, post: after, why: r.why + (blur ? BLUR : ""), lv: blur ? "chk" : r.lv,
            wf: ln.s.slice(ws, we), wt: (ln.s.slice(ws, m.index) + to + ln.s.slice(m.index + m[0].length, we)).trim(), ws: ws, mi: m.index, ml: m[0].length });
          if (m[0].length === 0) r.re.lastIndex++;
        }
      });
      // 한 낱말에 고칠 곳이 여럿이면 한 줄로 합쳐 모두 고친 모양을 보여 준다(2026-11-23 「수있을것같아요 → 수있을 것 같아요」처럼 반만 고쳐 보이던 것)
      var mine = found.splice(f0), byW = {};
      mine.forEach(function (f) { var k = f.ws === undefined ? "x" + Math.random() : f.ws + "|" + f.wf; (byW[k] = byW[k] || []).push(f); });
      Object.keys(byW).forEach(function (k) {
        var g = byW[k]; if (g.length === 1) { found.push(g[0]); return; }
        g.sort(function (a, b) { return b.mi - a.mi; });
        var w = g[0].wf, lastS = Infinity, whys = [];
        g.forEach(function (f) { var a = f.mi - f.ws, e = a + f.ml; if (e > lastS) return; w = w.slice(0, a) + f.to + w.slice(e); lastS = a; whys.unshift(f.why.replace(BLUR, "")); });
        var blur = g.some(function (f) { return f.why.indexOf(BLUR) >= 0; }), base = g[g.length - 1];
        found.push({ t: base.t, from: base.wf, to: w.trim(), pre: "", post: "", wf: base.wf, wt: w.trim(), why: whys.filter(function (x, i) { return whys.indexOf(x) === i; }).join(" · ") + (blur ? BLUR : ""),
          lv: g.some(function (f) { return f.lv === "bad"; }) ? "bad" : "chk" });
      });
      var tk = ln.s.split(/\s+/);
      for (var a = 0; a < tk.length; a++) for (var b = a + 1; b < Math.min(tk.length, a + 4); b++) {
        var seg = tk.slice(a, b + 1), raw = seg.join(""), joined = DEPTS.indexOf(raw) >= 0 ? raw : raw.replace(/(은|는|이|가|을|를|의|에|에서|에서는|도|와|과|랑|이랑|로|으로|만|까지)$/, "");
        if (DEPTS.indexOf(joined) >= 0 && !seen["s" + joined]) {
          seen["s" + joined] = 1; var wf = seg.join(" ");
          found.push({ t: ln.t, from: wf, to: joined, pre: "", post: "", wf: wf, wt: seg.join("").trim(), why: "학과 이름은 조직도 표기대로 붙여 써요" + (ocrWeak[ln.s] ? BLUR : ""), lv: ocrWeak[ln.s] ? "chk" : "bad" });
        }
      }
      var re = /([가-힣A-Za-z]{2,}?)(학과|학부|교육과)/g, d;
      while ((d = re.exec(ln.s))) {
        var w = d[0];
        if (DEPTS.indexOf(w) >= 0 || DEPTS.some(function (x) { return w.length > x.length && w.slice(-x.length) === x; }) || seen["d" + w]) continue;
        seen["d" + w] = 1;
        var key2 = w.split("").sort().join(""), sim = DEPTS.filter(function (x) { return x.split("").sort().join("") === key2; })[0] || nearest(w);
        found.push({ t: ln.t, from: w, to: sim || w, pre: "", post: "", wf: w, wt: sim || "(학과 이름 확인)", why: (sim ? "조직도 표기와 달라요" : "조직도에 없는 학과 이름이에요 · 확인해 주세요") + (ocrWeak[ln.s] ? BLUR : ""), lv: "chk" });
      }
    });
    if ($("subs").dataset.ocr !== "1" && list.some(function (ln) { return /\?/.test(ln.s); })) list.forEach(function (ln) {
      var s = ln.s.trim(), q = s.match(/([가-힣]+(까요|나요|가요|을까|ㄹ까|는지요|습니까|입니까|냐|어때|어때요|래요|죠))$/);
      if (q) found.push({ t: ln.t, from: q[1], to: q[1] + "?", pre: "", post: "", wf: q[1], wt: q[1] + "?", why: "묻는 말이면 물음표를 붙여요(같은 영상의 다른 질문엔 있어요)", lv: "chk" });
    });
    var merged = [], at = {};
    found.forEach(function (f) {
      var k = f.t + "|" + f.wf, g = at[k];
      if (!g) { at[k] = f; merged.push(f); return; }
      if (g.wt.indexOf(f.from) >= 0 && f.from !== f.to) g.wt = g.wt.replace(f.from, f.to).trim();
      if (g.why.indexOf(f.why) < 0) g.why += " · " + f.why;
      if (f.lv === "bad") g.lv = "bad";
    });
    found = merged;
    var ul = $("fix"); ul.innerHTML = "";
    found.sort(function (a, b) { return (a.lv === "bad" ? 0 : 1) - (b.lv === "bad" ? 0 : 1); });
    found.forEach(function (f) {
      var li = document.createElement("li"); li.className = f.lv;
      if (f.t) { var t = document.createElement("div"); t.className = "t"; t.textContent = f.t; li.appendChild(t); }
      var ch = document.createElement("div"); ch.className = "ch";
      var s = document.createElement("s"); s.textContent = f.wf; ch.appendChild(s);
      ch.appendChild(document.createTextNode(" → ")); var st = document.createElement("strong"); st.textContent = f.wt; ch.appendChild(st);
      var w = document.createElement("div"); w.className = "why"; w.textContent = (f.lv === "bad" ? "" : "확인 · ") + f.why;
      li.appendChild(ch); li.appendChild(w); ul.appendChild(li);
    });
    var nb = found.filter(function (f) { return f.lv === "bad"; }).length;
    $("subSum").hidden = false; $("subNote").hidden = false;
    subCheck.last = { n: list.length, bad: nb, chk: found.length - nb }; subCheck.found = found;
    $("subSum").textContent = !list.length ? "자막 글을 넣어 주세요" : found.length ? "고칠 곳 " + nb + "개" + (found.length - nb ? " · 확인할 곳 " + (found.length - nb) + "개" : "") : "✓ 자주 틀리는 건 안 보여요";
  }
  $("subCheck").onclick = subCheck;
  $("sfile").onchange = function (e) { var f = e.target.files[0]; if (f) f.text().then(function (s) { $("subs").value = s; $("subs").dataset.ocr = ""; ocrLow = {}; ocrWeak = {}; subCheck(); }); e.target.value = ""; };
  $("subs").addEventListener("paste", function () { $("subs").dataset.ocr = ""; ocrLow = {}; ocrWeak = {}; });
})();
</script>
